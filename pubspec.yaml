name: water
description: "Siply - Water Reminder Application"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_local_notifications: 18.0.1
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  timezone: 0.9.4
  fl_chart: ^0.70.2
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  http: ^1.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1

  flutter_timezone: ^5.1.0
  flutter_native_splash: ^2.4.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/siply.logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/siply.logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/siply.logo.png"
  android_12:
    image: "assets/images/siply.logo.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
